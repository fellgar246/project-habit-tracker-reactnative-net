services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: habittracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d habittracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/HabitTracker.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=habittracker;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT__Issuer:-HabitTracker}
      Jwt__Audience: ${JWT__Audience:-HabitTracker}
      Jwt__Key: ${JWT__Key}
      Jwt__AccessTokenMinutes: ${JWT__AccessTokenMinutes:-15}
      Jwt__RefreshTokenDays: ${JWT__RefreshTokenDays:-7}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}

volumes:
  pgdata:
